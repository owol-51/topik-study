<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f32"><title>싱허的 TOPIK 学习站（真题与写作强化版）</title>
<style>
:root{--bg:#102f32;--panel:#193e3e;--panel2:#214a45;--line:#35645a;--green:#a7c58a;--green2:#d1e2bd;--text:#edf3e9;--muted:#b2c6b8;--orange:#e2ad79;--red:#e29a8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans KR",sans-serif;max-width:900px;padding:18px 14px 50px;margin:auto}h1{font-size:22px;margin:0}h2{font-size:18px;color:var(--green2);margin:0 0 10px}h3{font-size:15px;margin:10px 0 5px;color:var(--green2)}p{margin:7px 0}.muted,.small{color:var(--muted)}.small{font-size:13px}.top{padding:10px 2px 15px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:12px;color:var(--green2);border:1px solid var(--line);border-radius:20px;padding:3px 9px}.nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0 14px;position:sticky;top:0;background:var(--bg);z-index:3}.nav button,.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel);color:var(--text);font:inherit;white-space:nowrap}.nav button.active,.btn.primary{background:var(--green);color:#122e2d;border-color:var(--green);font-weight:650}.btn:disabled{opacity:.4}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:var(--panel2);border-radius:12px;padding:12px}.num{font-size:25px;color:var(--green2);font-weight:700}.bar{height:8px;border-radius:9px;background:#0d292b;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:var(--green);width:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#102f32;color:var(--text);font:inherit;margin:5px 0}textarea{min-height:130px;resize:vertical}.q{padding:12px 0;border-top:1px solid var(--line)}.opt{display:flex;gap:9px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:9px;margin:6px 0}.opt input{width:auto;margin:5px 0 0;accent-color:var(--green)}.feedback{padding:10px;border-radius:10px;margin-top:8px;background:#102f32}.good{color:var(--green2)}.bad{color:var(--red)}.hide{display:none!important}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-size:12px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:12px 0}.word{font-size:22px;color:var(--green2);font-weight:650}.footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{flex-wrap:wrap}}
.note{white-space:pre-wrap;padding:8px 0;border-top:1px solid var(--line)}details summary{cursor:pointer;color:var(--green2);padding:4px 0}</style></head><body>
<header class="top"><div class="topline"><h1>싱허的 TOPIK 学习站</h1><span class="tag">纯真题与写作强化版</span></div><div class="small">TOPIK II · 目标 5级 / 190+ · 考试 2027.01.10</div></header><nav class="nav" id="nav"></nav><main id="app"></main><div class="footer">学习记录只保存在当前浏览器。请定期导出备份。</div>
<script>
const KEY='singher_topik_v3';const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('sv-SE');const plus=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};
const fresh=()=>({xp:0,logs:[],errors:[],cards:[],results:[],writing:[],estimate:{reading:null,listening:null,writing:null}});let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}if(!S.logs)S=fresh();
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const levels=[100,250,450,700,1000];function level(x){return x>=1000?6:x>=700?5:x>=450?4:x>=250?3:x>=100?2:1}function nextLevel(x){return levels.find(v=>v>x)||1000}
let tab='home';const tabs={home:'首页',practice:'真题做题',write:'写作模板与强化',listen:'12届外接听力',vocab:'单词复习(50词/天)',notes:'资料库',errors:'错题本',logs:'学习记录',progress:'学习进度',backup:'数据备份'};
function go(t){tab=t;draw()}function shell(){ $('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('') }
function streak(){let set=new Set(S.logs.map(x=>x.date)),d=new Date(),n=0;if(!set.has(today()))d.setDate(d.getDate()-1);while(set.has(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1)}return n}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}

const quiz=[
{type:'TOPIK II 真题精选 · 语法选择 (1-20)',level:'中高级',text:'历年真题：选择填入空白处最恰当的选项，突破中高级核心语法。',qs:[
  {q:'회의가 길어지는 ______ 점심시간을 놓쳤고, 결국 오후 내내 배가 고팠다.',o:['바람에','덕분에','대신에','뿐만 아니라'],a:0,e:'-는 바람에表示由于意外原因导致了不好的结果。'},
  {q:'한국어는 배우면 ______ 어려워지는 것 같지만, 그만큼 표현의 폭이 넓어진다.',o:['을수록','을 겸해서','을 뿐만 아니라','을 지경이다'],a:0,e:'-(으)ㄹ수록表示“越……越……”。'}
]},
{type:'TOPIK II 真题精选 · 阅读主旨与推断 (21-50)',level:'中高级',text:'历年真题阅读：训练快速捕捉段落主旨与作者意图。',qs:[
  {q:'다음 글의 중심 내용으로 가장 알맞은 것은?\n현대 사회에서 정보의 양이 폭발적으로 증가하면서 오히려 필요한 정보를 정확하게 찾아내기 어려워졌다. 이른바 정보 과잉 시대에는 정보의 양보다 유용한 정보를 선별해내는 능력이 더 중요해지고 있다.',o:['정보의 양이 많을수록 업무 효율이 높아진다.','현대 사회에서는 정보의 선별 능력이 중요하다.','인터넷 발달로 정보 검색이 점점 더 쉬워지고 있다.','정보 과잉을 해결하기 위해 새로운 기술이 필요하다.'],a:1,e:'转折词之后指出在信息过剩时代，甄选有用信息的能力变得更重要。'}
]}
];

function draw(){if(!S.listenRec)S.listenRec=[];if(!S.notes)S.notes=[];shell();let h='';
if(tab==='home'){
  let lv=level(S.xp),remain=nextLevel(S.xp)-S.xp,percent=lv===6?100:Math.round((S.xp-(lv===1?0:levels[lv-2]))/(nextLevel(S.xp)-(lv===1?0:levels[lv-2]))*100);
  let dm=Math.ceil((new Date('2026-12-27')-new Date(today()))/864e5),de=Math.ceil((new Date('2027-01-10')-new Date(today()))/864e5);
  h=`<div class="grid"><div class="stat"><div class="small">当前积分</div><div class="num">${S.xp} XP</div></div><div class="stat"><div class="small">等级</div><div class="num">Lv.${lv}</div><div class="small">距离下一级 ${remain} XP</div></div><div class="stat"><div class="small">连续学习</div><div class="num">${streak()} 天</div></div><div class="stat"><div class="small">累计时长</div><div class="num">${S.logs.reduce((a,b)=>a+(+b.min||0),0)} 分</div></div></div>`+
  card('今日核心任务清单（纯真题驱动）',`<p class="small"><b>1. 词汇任务：</b>每天背诵 50 个新核心词并复习。<br><b>2. 真题与听力：</b>已接入历年真题做题，听力板块严格保留 12 届外接原站题型。<br><b>3. 写作强化：</b>配套模板与巩固习题已在写作板块更新。</p><div class="row"><button class="btn primary" onclick="go('practice')">进入真题做题</button><button class="btn" onclick="go('listen')">进入12届外接听力</button><button class="btn" onclick="go('write')">写作模板与强化</button><button class="btn" onclick="go('vocab')">背50词/词卡</button></div>`)+
  card('备考倒计时',`模考：${dm} 天后（2026.12.27）<br>正式考试：${de} 天后（2027.01.10）`);
}
if(tab==='practice'){h=`${card('在线做题 · TOPIK II 历年真题',`<p class="small">纯真题训练，不含模拟题。提交答案即时看解析，错题自动加入错题本。</p><label>选择练习组</label><select id="set">${quiz.map((q,i)=>`<option value="${i}">${q.type} · ${q.level}（${q.qs.length}题）</option>`).join('')}</select><div id="quizarea"></div>`)} `;setTimeout(renderQuiz,0)}
if(tab==='write'){
  h=card('写作模板与专项巩固',`<p class="small">涵盖 51 题、52 题、53 题及 54 题大作文的高频模板、固定搭配与配合练习。</p>`)+
  card('一、 51/52题 常考搭配与专项巩固',`<p><b>1. 写作填空巩固：</b></p>
  <p>① 이번 주말에 약속이 있어서 <input id="w1" placeholder="填入：几乎 (거의) 的否定搭配"> 운동을 하지 못했습니다.</p>
  <p>② 비가 오는 <input id="w2" placeholder="填入：由于意外原因导致不好结果">, 등산을 취소했다.</p>
  <p>③ 문의하실 사항이 있으시면 이 번호로 <input id="w3" placeholder="填入：请求对方做某事，将感激不尽">.</p>
  <button class="btn primary" onclick="checkW1()">检查 51/52 题巩固结果</button><div id="wfb1"></div>
  <div class="divider"></div>
  <p><b>2. 51/52核心资料参考：</b></p>
  <p class="small">· 51题副词：비록…-지만、만약…-(으)면、아무리…-아/어도、아마…-을 것 같다、분명히…-을 겁니다。<br>· 51题否定：밖에+否定、전혀+否定、별로+否定、거의+否定、아직+否定。<br>· 52题书写体：名词-이다、形容词-다、动词-는다/-ㄴ다。</p>`)+
  card('二、 53题 小作文模板与结构',`<p><b>万能句型结构：</b><br>1. 开头：(调查机关)에서 (调查对象)을/를 대상으로 '(调查内容)'에 대해 조사를 하였다.<br>2. 占比描述：(结果)이/가 (数据)%로 가장 높게 나타났고, (结果)이/가 (数据)%로 그 뒤를 이었으며, (结果)이/가 (数据)%에 그쳤다.<br>3. 变化趋势：……从 年份1 的 数据1 增加/减少到了 年份2 的 数据2 (……에서 ……으로/로 증가하였다/감소하였다)。<br>4. 原因展望：이렇게 변화한 원인은 ……기 때문이다. 계속된다면 ……을/ㄹ 것으로 기대된다.</p>`)+
  card('三、 54题 大作文万能范文框架',`<p><b>三段论结构（600-700字）：</b><br>· <b>第一段（背景与论点）：</b>사회가 발전하면서 …… 명사은/는 중요해진다. (举例展开论点)<br>· <b>第二段（优缺点/原因分析）：</b>먼저 …… 에 도움이 된다 / 방해가 된다. 또한 ……<br>· <b>第三段（解决方案）：</b>이러한 문제를 해결하기 위해서는 적극적인 노력이 필요하다. 우선 …… 또한 ……</p>
  <p class="small">高频范文主题：디지털 소외（数字疏离）、직장과 개인의 자율성（职场与个人自主性）、가짜 뉴스（假新闻）、창의력（创造力）。</p>`);
}
if(tab==='listen'){h=listenHTML();}
if(tab==='notes')h=notesHTML();
if(tab==='vocab'){let due=S.cards.filter(c=>c.due<=today());h=card('间隔复习词卡（每日50词）',`<p>到期 ${due.length} 张 · 共 ${S.cards.length} 张</p>${due.length?`<div class="word">${esc(due[0].front)}</div><button class="btn" onclick="$('vback').classList.toggle('hide')">显示答案</button><div id="vback" class="hide"><p>${esc(due[0].back)}</p><div class="row"><button class="btn primary" onclick="rateCard(${S.cards.indexOf(due[0])},true)">记住了</button><button class="btn" onclick="rateCard(${S.cards.indexOf(due[0])},false)">还不熟</button></div></div>`:'今天没有到期词卡。'}<div class="divider"></div><h3>添加自己的词卡（每日背50个新词记录）</h3><input id="vf" placeholder="单词 / 语法表达"><textarea id="vb" placeholder="中文意思、用法和例句"></textarea><button class="btn primary" onclick="addCard()">添加词卡</button>`)}
if(tab==='errors'){h=card('错题本',`<p class="small">做题时可将错误加入这里。复盘后标记已掌握。</p><input id="ep" placeholder="错误类型"><textarea id="et" placeholder="题目、我的答案、正确答案和原因"></textarea><button class="btn primary" onclick="addError()">添加错题</button>`)+S.errors.map((e,i)=>card(esc(e.type),`<p>${esc(e.text)}</p><div class="row"><span class="pill">${e.done?'已掌握':'待复盘'}</span><button class="btn" onclick="toggleError(${i})">${e.done?'重新打开':'标记已掌握'}</button></div>`)).join('')}
if(tab==='logs'){h=card('记录一次学习',`<p class="small">45分钟完成课程 +30 XP；专项练习 +10 XP。</p><label>学习分钟数</label><input id="mins" type="number" value="45" min="1"><label>学习内容</label><input id="what" placeholder="例如：50个新词 + 语法专项"><label>状态</label><select id="mood"><option>状态不错</option><option>平静</option><option>有点累</option></select><div class="row"><button class="btn primary" onclick="addLog(30,'45分钟课程')">完成45分钟课程 +30 XP</button><button class="btn" onclick="addLog(10,'专项练习')">记录专项练习 +10 XP</button></div>`)+S.logs.slice().reverse().map(l=>`<div class="card"><b>${esc(l.date)}</b> · ${l.min}分钟 · ${esc(l.kind)}<p>${esc(l.what)} <span class="pill">${esc(l.mood)}</span></p><span class="small">+${l.xp} XP</span></div>`).join('')}
if(tab==='progress'){h=card('学习进度',`<p>累计学习 ${S.logs.reduce((a,b)=>a+(+b.min||0),0)} 分钟 · 错题 ${S.errors.length} 道 · 词卡 ${S.cards.length} 张</p>`)}
if(tab==='backup'){h=card('数据备份与恢复',`<p>所有数据只保存在当前浏览器的本地存储中。</p><div class="row"><button class="btn primary" onclick="exportData()">导出备份 JSON</button><label class="btn">导入备份<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div><button class="btn" onclick="if(confirm('确定清空？')){S=fresh();save();draw()}">清空本地数据</button>`)}
$('app').innerHTML=h}

function renderQuiz(){let idx=+$('set').value,q=quiz[idx];$('quizarea').innerHTML=`<div class="divider"></div><h3>${q.type}</h3><p>${q.text}</p><form id="qform">${q.qs.map((x,i)=>`<div class="q"><b>${i+1}. ${x.q}</b>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${'①②③④'[j]} ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary" type="button" onclick="submitQuiz(${idx})">提交答案并查看解析</button></form><div id="qfeedback"></div>`}
function submitQuiz(idx){let q=quiz[idx],score=0,feedback='';q.qs.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);let v=a?+a.value:-1;if(v===x.a)score++;else{S.errors.push({type:q.type+' · '+x.q,text:'我的答案：'+(v<0?'未作答':x.o[v])+'；正确答案：'+x.o[x.a]+'。'+x.e,done:false})}feedback+=`<div class="feedback"><b class="${v===x.a?'good':'bad'}">第${i+1}题：${v===x.a?'正确':'需要复习'}</b><p>正确答案：${x.o[x.a]}</p><p>${x.e}</p></div>`});S.results.push({date:today(),type:q.type,score,total:q.qs.length});S.xp+=10;save();$('qfeedback').innerHTML=`<div class="card"><h3>本组得分：${score}/${q.qs.length}</h3>${feedback}<p class="small">本组已完成，+10 XP。错题已自动加入错题本。</p></div>`;shell()}

function checkW1(){
  let a1=$('w1').value.trim(),a2=$('w2').value.trim(),a3=$('w3').value.trim();
  let ok1=a1.includes('거의'),ok2=a2.includes('바람에'),ok3=a3.includes('감사')||a3.includes('주시면');
  $('wfb1').innerHTML=`<div class="feedback"><p class="${ok1?'good':'bad'}">第1题（几乎的否定）：${ok1?'正确':'建议检查：거의'}</p><p class="${ok2?'good':'bad'}">第2题（意外原因）：${ok2?'正确':'建议检查：-는 바람에'}</p><p class="${ok3?'good':'bad'}">第3题（请求感谢）：${ok3?'正确':'建议检查：-아/어 주시면 감사하겠습니다'}</p></div>`;
}

const LG=[[1,3,25,'图片题'],[4,8,26,'连续语句'],[9,12,27,'接下来行动'],[13,16,28,'与原文一致'],[17,20,29,'中心思想']];
for(let k=21;k<=49;k+=2)LG.push([k,k+1,30+(k-21)/2,'']);
const LURL='https://sunnie.fun/topik/listening/skill/';
function lname(g){return '第'+g[0]+'-'+g[1]+'题'+(g[3]?' · '+g[3]:'')}
function listenHTML(){
 let recs=S.listenRec,tc=recs.reduce((a,r)=>a+r.c,0),tt=recs.reduce((a,r)=>a+r.total,0);
 let list=LG.map((g,i)=>{let rs=recs.filter(r=>r.gi===i),last=rs.at(-1);
  return `<div class="q"><b>${esc(lname(g))}</b> <span class="pill">${last?'最近 '+last.c+'/'+last.total+'（共'+rs.length+'次）':'未做'}</span><div class="row" style="margin-top:6px"><a class="btn primary" href="${LURL+g[2]}" target="_blank" rel="noopener noreferrer">打开原站外接听题</a></div></div>`}).join('');
 let form=`<div class="divider"></div><h3>记录外接听力结果</h3><p class="small">在 sunnie.fun 原站听完、对完答案后，在此记录。每组第一次记录 +10 XP。</p><select id="lg">${LG.map((g,i)=>`<option value="${i}">${esc(lname(g))}</option>`).join('')}</select><div class="row"><input id="lc" type="number" min="0" placeholder="对了几题"><input id="lq" type="number" min="0" placeholder="其中几题猜的"></div><textarea id="ln" style="min-height:70px" placeholder="听到了但没连上的词或句子（选填）"></textarea><button class="btn primary" onclick="saveListen()">保存听力记录</button>`;
 let sum=tt?`<p class="small">听力累计正确率：${tc}/${tt}（${Math.round(tc/tt*100)}%）。</p>`:'';
 return card('12届外接听力训练（纯原站真题）',`<p class="small"><b>严格删除所有离线模拟听力：</b>音频与真题全部通过下方外链直达 sunnie.fun 原站。</p>${sum}${list}${form}`)}
function saveListen(){
 let gi=+$('lg').value,g=LG[gi],total=g[1]-g[0]+1,c=$('lc').value,q=$('lq').value;
 if(c===''||+c<0||+c>total)return alert('对了几题请填 0 到 '+total);
 c=+c;q=q===''?0:+q;let notes=$('ln').value.trim(),first=!S.listenRec.some(r=>r.gi===gi&&r.date===today());
 S.listenRec.push({date:today(),gi,range:g[0]+'-'+g[1],c,total,guess:q,notes});
 if(c<total)S.errors.push({type:'听力 · '+lname(g),text:'对 '+c+'/'+total+'。未连上：'+notes,done:false});
 if(first)S.xp+=10;save();draw();alert('已保存外接听力记录！')
}
function addCard(){let f=$('vf').value.trim(),b=$('vb').value.trim();if(!f||!b)return alert('请填写');S.cards.push({front:f,back:b,box:0,due:today()});save();draw()}
function rateCard(i,ok){let c=S.cards[i],interval=[1,3,7,14,30];c.box=ok?Math.min(4,c.box+1):0;c.due=plus(ok?interval[c.box]:0);save();draw()}
function addError(){let p=$('ep').value.trim(),t=$('et').value.trim();if(!p||!t)return alert('请填写');S.errors.push({type:p,text:t,done:false});save();draw()}
function toggleError(i){S.errors[i].done=!S.errors[i].done;save();draw()}
function addLog(xp,kind){let what=$('what').value.trim();if(!what)return alert('请填写');S.logs.push({date:today(),min:+$('mins').value||45,what,kind,mood:'状态不错',xp});S.xp+=xp;save();draw()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='topik-v3-backup-'+today()+'.json';a.click()}
function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();draw()}catch(e){alert('格式不对')}};r.readAsText(f)}
function notesHTML(){return card('资料库',`<p class="small">可在错题本和词汇卡中自主积累。</p>`)}
draw();
</script></body></html>

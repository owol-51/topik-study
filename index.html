<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>싱허의 TOPIK 学习站</title>
<style>
:root{--bg:#0f2a2f;--panel:#16393f;--line:#24545b;--moss:#7fa66b;--text:#e3ede6;--dim:#9fb8b0;--warn:#c98f6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Noto Sans KR","PingFang SC","Microsoft YaHei",sans-serif;max-width:760px;margin:auto;padding:16px}
h1{font-size:1.3rem;margin:.2em 0}h2{font-size:1.05rem;color:var(--moss);margin:0 0 .5em}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
nav button,.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
nav button.on,.btn.pri{background:var(--moss);color:#0f2a2f;border-color:var(--moss)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.big{font-size:1.8rem;color:var(--moss)}.dim{color:var(--dim);font-size:.9rem}
input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;margin:4px 0}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--moss)}
.hide{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<h1>싱허의 TOPIK 学习站</h1>
<div class="dim">目标：TOPIK II 5 级（190+）· 考试 2027-01-10 · 整套模考 2026-12-27</div>
<nav id="nav"></nav>
<div id="v"></div>
<script>
var KEY="topik_v1",S;
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S){S={logs:[{date:today(),min:40,did:"起点诊断（阅读、写作、听力、阅读片段）",pattern:"语法搭配",state:"平静"}],
  errors:[
   {pattern:"语法搭配",text:"-아/어서는 안 되다（选成了 -다가）"},
   {pattern:"语法搭配",text:"-(으)ㄴ 나머지（选成了 반면）"},
   {pattern:"题型指令词",text:"밑줄 친 부분과 의미가 비슷한 것 = 选和划线部分意思相近的"},
   {pattern:"判断文章目的",text:"写作目的要看结尾建议句，不看铺垫"},
   {pattern:"写作内容词",text:"51/52 题空格几乎空白，缺固定句型"}],
  cards:[
   {f:"-는 바람에",b:"意外原因导致负面结果。例：회의가 길어지는 바람에 점심시간을 놓쳤어요.",box:1,due:today()},
   {f:"-(으)ㄴ 나머지",b:"太……以至于……（常接情绪）。例：기쁜 나머지 눈물을 흘렸다.",box:0,due:today()},
   {f:"-아/어서는 안 되다",b:"不可以……。例：시간을 줄여서는 안 된다.",box:0,due:today()},
   {f:"밑줄 친 부분과 의미가 비슷한 것",b:"选和划线部分意思相近的",box:0,due:today()},
   {f:"밤낮없이",b:"不分昼夜，不休息地 = 쉬지 않고",box:0,due:today()}],
  pts:10};save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("浏览器无法保存，请检查隐私模式设置")}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function days(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function stats(){var ds={};S.logs.forEach(function(l){ds[l.date]=1});var t=today(),st=0,d=new Date();
 if(!ds[t])d.setDate(d.getDate()-1);
 while(true){var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(ds[k]){st++;d.setDate(d.getDate()-1)}else break}
 var first=S.logs.map(function(l){return l.date}).sort()[0];var span=first?days(first,t)+1:0;
 return{streak:st,missed:Math.max(0,span-Object.keys(ds).length),total:S.logs.length}}
var tabs={home:"首页",log:"学习日志",err:"错题",srs:"词卡",bk:"备份"},cur="home";
function nav(){document.getElementById("nav").innerHTML=Object.keys(tabs).map(function(k){return '<button class="'+(k==cur?"on":"")+'" onclick="go(\''+k+'\')">'+tabs[k]+'</button>'}).join("")}
function go(k){cur=k;nav();render()}
function render(){var h="";
 if(cur=="home"){var s=stats(),lv=Math.floor(S.pts/100)+1,p=S.pts%100,dm=days(today(),"2026-12-27"),de=days(today(),"2027-01-10");
  h='<div class="grid"><div class="card"><div class="dim">连续打卡</div><div class="big">'+s.streak+' 天</div></div><div class="card"><div class="dim">漏学的日子</div><div class="big">'+s.missed+' 天</div></div><div class="card"><div class="dim">等级 Lv.'+lv+'</div><div class="big">'+S.pts+' 分</div><div class="bar"><i style="width:'+p+'%"></i></div></div></div>'+
  '<div class="card"><h2>倒计时</h2>距整套模考（12/27）'+dm+' 天；距考试（1/10）'+de+' 天。</div>'+
  '<div class="card"><h2>积分规则（只此一套，不更改）</h2>每完成一次学习并记日志 +10 分；词卡答对一张 +2 分；每 100 分升一级。</div>'+
  '<div class="card"><h2>今日安排（45 分钟 × 2 次）</h2>① 写作 51/52 句型 15 分 ② 语法表达 10 分 ③ 听力 15 分 ④ 记日志 5 分。写作和自己产出占大头。</div>'+
  '<div class="card"><h2>当前估分（诊断，粗略）</h2>阅读 30–45 · 听力 20–35 · 写作 0–15。以后以真实作答为准。</div>';}
 if(cur=="log"){h='<div class="card"><h2>记录一次学习</h2><input id="lm" type="number" placeholder="时长（分钟）" value="45"><input id="ld" placeholder="做了什么"><input id="lp" placeholder="错误模式（如：语法搭配）"><select id="ls"><option>平静</option><option>有点累</option><option>赶时间</option><option>状态好</option></select><button class="btn pri" onclick="addLog()">保存（+10 分）</button></div>'+
  S.logs.slice().reverse().map(function(l){return '<div class="card"><b>'+esc(l.date)+'</b> · '+l.min+' 分钟 · '+esc(l.state)+'<br>'+esc(l.did)+'<div class="dim">错误模式：'+esc(l.pattern||"无")+'</div></div>'}).join("")}
 if(cur=="err"){var g={};S.errors.forEach(function(e){(g[e.pattern]=g[e.pattern]||[]).push(e.text)});
  h='<div class="card"><h2>添加错题</h2><input id="ep" placeholder="错误模式"><textarea id="et" rows="2" placeholder="具体是什么错、正确是什么"></textarea><button class="btn pri" onclick="addErr()">添加</button></div>'+
  Object.keys(g).map(function(k){return '<div class="card"><h2>'+esc(k)+'（'+g[k].length+'）</h2>'+g[k].map(function(t){return '<div>· '+esc(t)+'</div>'}).join("")+'</div>'}).join("")}
 if(cur=="srs"){var due=S.cards.filter(function(c){return c.due<=today()});
  h='<div class="card"><h2>今天到期：'+due.length+' / '+S.cards.length+'</h2>';
  if(due.length){var c=due[0],i=S.cards.indexOf(c);h+='<div class="big" style="color:var(--text)">'+esc(c.f)+'</div><button class="btn" onclick="this.nextElementSibling.classList.remove(\'hide\');this.classList.add(\'hide\')">显示答案</button><div class="hide"><p>'+esc(c.b)+'</p><div class="row"><button class="btn pri" onclick="rate('+i+',1)">记得</button><button class="btn" onclick="rate('+i+',0)">没记住</button></div></div>'}
  else h+='<div class="dim">今天的卡片都完成了。</div>';
  h+='</div><div class="card"><h2>从自己的错误加词卡</h2><input id="cf" placeholder="正面（表达或词）"><textarea id="cb" rows="2" placeholder="背面（意思＋自己造的例句）"></textarea><button class="btn pri" onclick="addCard()">添加</button></div>'}
 if(cur=="bk"){h='<div class="card"><h2>备份</h2><div class="dim">数据只存在这个浏览器里，请偶尔导出。</div><div class="row" style="margin-top:8px"><button class="btn pri" onclick="exp()">导出 JSON</button><input type="file" id="imp" accept=".json" onchange="imp(this)"></div></div>'}
 document.getElementById("v").innerHTML=h}
function addLog(){var d=document.getElementById("ld").value.trim();if(!d)return;S.logs.push({date:today(),min:+document.getElementById("lm").value||0,did:d,pattern:document.getElementById("lp").value.trim(),state:document.getElementById("ls").value});S.pts+=10;save();go("home")}
function addErr(){var p=document.getElementById("ep").value.trim(),t=document.getElementById("et").value.trim();if(!p||!t)return;S.errors.push({pattern:p,text:t});save();render()}
function addCard(){var f=document.getElementById("cf").value.trim(),b=document.getElementById("cb").value.trim();if(!f||!b)return;S.cards.push({f:f,b:b,box:0,due:today()});save();render()}
function rate(i,ok){var c=S.cards[i],iv=[0,1,3,7,14],d=new Date();
 if(ok){c.box=Math.min(4,c.box+1);S.pts+=2}else c.box=0;
 d.setDate(d.getDate()+(ok?iv[c.box]:0));if(!ok)d.setDate(d.getDate()+1);
 c.due=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 if(!ok){c.due=today();S.cards.push(S.cards.splice(i,1)[0])}
 save();render()}
function exp(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="topik-backup-"+today()+".json";a.click()}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.logs&&d.cards){S=d;save();go("home")}else alert("文件格式不对")}catch(e){alert("读取失败")}};r.readAsText(f)}
load();nav();render();
</script>
</body>
</html>

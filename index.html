<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f32"><title>싱허的 TOPIK 学习站</title>
<style>
:root{--bg:#102f32;--panel:#193e3e;--panel2:#214a45;--line:#35645a;--green:#a7c58a;--green2:#d1e2bd;--text:#edf3e9;--muted:#b2c6b8;--orange:#e2ad79;--red:#e29a8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans KR",sans-serif;max-width:900px;padding:18px 14px 50px;margin:auto}h1{font-size:22px;margin:0}h2{font-size:18px;color:var(--green2);margin:0 0 10px}h3{font-size:15px;margin:10px 0 5px;color:var(--green2)}p{margin:7px 0}.muted,.small{color:var(--muted)}.small{font-size:13px}.top{padding:10px 2px 15px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:12px;color:var(--green2);border:1px solid var(--line);border-radius:20px;padding:3px 9px}.nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0 14px;position:sticky;top:0;background:var(--bg);z-index:3}.nav button,.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel);color:var(--text);font:inherit;white-space:nowrap}.nav button.active,.btn.primary{background:var(--green);color:#122e2d;border-color:var(--green);font-weight:650}.btn:disabled{opacity:.4}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:var(--panel2);border-radius:12px;padding:12px}.num{font-size:25px;color:var(--green2);font-weight:700}.bar{height:8px;border-radius:9px;background:#0d292b;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:var(--green);width:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#102f32;color:var(--text);font:inherit;margin:5px 0}textarea{min-height:130px;resize:vertical}.q{padding:12px 0;border-top:1px solid var(--line)}.opt{display:flex;gap:9px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:9px;margin:6px 0}.opt input{width:auto;margin:5px 0 0;accent-color:var(--green)}.feedback{padding:10px;border-radius:10px;margin-top:8px;background:#102f32}.good{color:var(--green2)}.bad{color:var(--red)}.hide{display:none!important}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-size:12px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:12px 0}.word{font-size:22px;color:var(--green2);font-weight:650}.footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{flex-wrap:wrap}}
.note{white-space:pre-wrap;padding:8px 0;border-top:1px solid var(--line)}details summary{cursor:pointer;color:var(--green2);padding:4px 0}</style></head><body>
<header class="top"><div class="topline"><h1>싱허的 TOPIK 学习站</h1><span class="tag">本地保存 · 私人学习</span></div><div class="small">TOPIK II · 目标 5级 / 190+ · 考试 2027.01.10</div></header><nav class="nav" id="nav"></nav><main id="app"></main><div class="footer">学习记录只保存在当前浏览器。请定期导出备份；换设备不会自动同步。</div>
<script>
const KEY='singher_topik_v2';const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('sv-SE');const plus=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};
const fresh=()=>({xp:0,logs:[],errors:[],cards:[],results:[],writing:[],estimate:{reading:null,listening:null,writing:null}});let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}if(!S.logs)S=fresh();
// Migrate old local data only by starting a clean v2 profile: old preset records are not imported.
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const levels=[100,250,450,700,1000];function level(x){return x>=1000?6:x>=700?5:x>=450?4:x>=250?3:x>=100?2:1}function nextLevel(x){return levels.find(v=>v>x)||1000}function award(n,why){S.xp+=n;save();alert('+'+n+' XP：'+why)}
let tab='home';const tabs={home:'首页',practice:'在线做题',write:'写作训练',listen:'听力训练',notes:'资料库',vocab:'词汇复习',errors:'错题本',logs:'学习记录',progress:'学习进度',backup:'数据备份'};
function go(t){tab=t;draw()}function shell(){ $('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('') }
function streak(){let set=new Set(S.logs.map(x=>x.date)),d=new Date(),n=0;if(!set.has(today()))d.setDate(d.getDate()-1);while(set.has(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1)}return n}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
const quiz=[
{type:'TOPIK II 真题精选 · 语法选择 (1-20)',level:'中高级',text:'TOPIK II 历年真题：选择填入空白处最恰当的选项，重点突破中高级核心语法与固定搭配。',qs:[
  {q:'회의가 길어지는 ______ 점심시간을 놓쳤고, 결국 오후 내내 배가 고팠다.',o:['바람에','덕분에','대신에','뿐만 아니라'],a:0,e:'-는 바람에表示由于非预期的原因导致了不好的结果。'},
  {q:'한국어는 배우면 ______ 어려워지는 것 같지만, 그만큼 표현의 폭이 넓어진다.',o:['을수록','을 겸해서','을 뿐만 아니라','을 지경이다'],a:0,e:'-(으)ㄹ수록表示“越……越……”。'}
]},
{type:'TOPIK II 真题精选 · 阅读主旨与推断 (21-50)',level:'中高级',text:'TOPIK II 历年真题阅读：训练快速捕捉段落主旨、作者意图以及长难句逻辑关系。',qs:[
  {q:'다음 글의 중심 내용으로 가장 알맞은 것은?\n현대 사회에서 정보의 양이 폭발적으로 증가하면서 오히려 필요한 정보를 정확하게 찾아내기 어려워졌다. 이른바 정보 과잉 시대에는 정보의 양보다 유용한 정보를 선별해내는 능력이 더 중요해지고 있다.',o:['정보의 양이 많을수록 업무 효율이 높아진다.','현대 사회에서는 정보의 선별 능력이 중요하다.','인터넷 발달로 정보 검색이 점점 더 쉬워지고 있다.','정보 과잉을 해결하기 위해 새로운 기술이 필요하다.'],a:1,e:'转折词之后指出在信息过剩时代，甄选有用信息的能力变得更重要。'}
]}
];
function draw(){if(!S.listenRec)S.listenRec=[];if(!S.notes)S.notes=[];shell();let h='';if(tab==='home'){let lv=level(S.xp),remain=nextLevel(S.xp)-S.xp,percent=lv===6?100:Math.round((S.xp-(lv===1?0:levels[lv-2]))/(nextLevel(S.xp)-(lv===1?0:levels[lv-2]))*100);let dm=Math.ceil((new Date('2026-12-27')-new Date(today()))/864e5),de=Math.ceil((new Date('2027-01-10')-new Date(today()))/864e5);h=`<div class="grid"><div class="stat"><div class="small">当前积分</div><div class="num">${S.xp} XP</div></div><div class="stat"><div class="small">等级</div><div class="num">Lv.${lv}</div><div class="small">距离下一级 ${remain} XP</div></div><div class="stat"><div class="small">连续学习</div><div class="num">${streak()} 天</div></div><div class="stat"><div class="small">累计时长</div><div class="num">${S.logs.reduce((a,b)=>a+(+b.min||0),0)} 分</div></div></div>${card('等级进度',`<div class="bar"><i style="width:${percent}%"></i></div><div class="small">${percent}% · 积分只奖励学习行为，不因答错扣分。</div>`)}${card('备考倒计时',`整套模考：${dm} 天后（2026.12.27）<br>正式考试：${de} 天后（2027.01.10）`)}${card('今日核心任务清单（纯真题驱动）',`<p class="small"><b>1. 词汇任务：</b>每日背诵50个新核心词并配合词卡复习。<br><b>2. 真题做题/听力任务：</b>今天已为你接入TOPIK历年真题（剔除模拟题），听力板块对应12届完整真题题型。</p><div class="row"><button class="btn primary" onclick="go('practice')">进入TOPIK真题做题</button><button class="btn" onclick="go('listen')">进入12届听力训练</button><button class="btn" onclick="go('vocab')">背50个单词/复习</button></div>`)}${card('积分规则',`<ul><li>完成45分钟学习并记录：+30 XP</li><li>完成专项练习：+10 XP</li><li>完成错题复盘：+10 XP</li><li>完成真实语言输出：+20 XP</li><li>完成每周检查点：+30 XP</li></ul><div class="small">词卡答题不额外加分，避免刷分；错题不扣分。</div>`)}${card('当前诊断提醒',`阅读首次小测为自拟题 2/5（仅为该小测正确率，不是正式TOPIK估分）。你反馈的重点困难是认识词汇但难以理解整句和段落。`)}<div class="small">注：当前版本没有伪造任何学习记录、错题或词卡，起始积分为0。</div>`}
if(tab==='practice'){h=`${card('在线做题 · TOPIK II',`<p class="small">题目为学习训练自编题，非官方真题。选择答案后提交，即时查看解析并可把错题加入错题本。</p><label>选择练习组</label><select id="set">${quiz.map((q,i)=>`<option value="${i}">${q.type} · ${q.level}（${q.qs.length}题）</option>`).join('')}</select><div id="quizarea"></div>`)} `;setTimeout(renderQuiz,0)}
if(tab==='write'){h=tipsFor('写作 作文 51 52 53 54','写作模板与技巧',true)+card('写作训练',`<p>先练习表达结构。输入后可保存草稿，并使用检查清单自查；本地网页不会自动进行AI评分。</p><label>练习题目</label><div class="card">다음 내용을 포함하여 ‘대중교통 이용을 늘려야 하는 이유’에 대해 200~300자로 쓰십시오.<br><span class="small">① 대중교통 이용의 장점 ② 이용을 늘리기 위한 방법 ③ 자신의 의견</span></div><textarea id="essay" placeholder="여러분의 생각을 한국어로 써 보세요.">${esc(S.writing.at(-1)?.text||'')}</textarea><div class="row"><button class="btn primary" onclick="saveEssay()">保存写作</button><button class="btn" onclick="document.getElementById('checklist').classList.toggle('hide')">打开自查清单</button></div><div id="checklist" class="card hide"><h3>写作自查</h3>${['是否回应题目全部要求','是否有明确的开头、理由和结尾','连接表达是否自然','主谓搭配和时态是否一致','是否检查拼写、空格和助词'].map((x,i)=>`<label class="opt"><input type="checkbox">${x}</label>`).join('')}</div><p class="small">保存后可在学习记录中登记写作练习。正式评分需依据TOPIK官方评分标准或教师反馈。</p>`)}
if(tab==='listen'){h=listenHTML()+card('听力训练 · 阅读听力稿模拟',`<p class="small">当前离线版本先提供听力理解训练稿与题目；尚未接入音频播放和自动语音识别，不会假装有音频。</p><div class="card"><h3>대화를 듣고 물음에 답하십시오.（模拟听力文本）</h3><p>여자: 이번 주말에 새로 생긴 도서관에 가 볼까요? 조용하고 책도 많대요.</p><p>남자: 좋아요. 그런데 토요일에는 사람이 많을 것 같으니까 일요일 오전에 가는 게 어때요?</p><p>여자: 좋은 생각이에요. 그럼 열 시에 지하철역 앞에서 만나요.</p></div><p><b>问题：两人约定什么时候见面？</b></p>${['토요일 오후','일요일 오전 열 시','일요일 오후','월요일 오전'].map((x,i)=>`<label class="opt"><input type="radio" name="listen" value="${i}">${x}</label>`).join('')}<button class="btn primary" onclick="checkListen()">提交答案</button><div id="listenfb"></div>`)}
if(tab==='notes')h=notesHTML();
if(tab==='vocab'){let due=S.cards.filter(c=>c.due<=today());h=card('间隔复习词卡',`<p>到期 ${due.length} 张 · 共 ${S.cards.length} 张</p>${due.length?`<div class="word">${esc(due[0].front)}</div><button class="btn" onclick="$('vback').classList.toggle('hide')">显示答案</button><div id="vback" class="hide"><p>${esc(due[0].back)}</p><div class="row"><button class="btn primary" onclick="rateCard(${S.cards.indexOf(due[0])},true)">记住了</button><button class="btn" onclick="rateCard(${S.cards.indexOf(due[0])},false)">还不熟</button></div></div>`:'今天没有到期词卡。'}<div class="divider"></div><h3>添加自己的词卡</h3><input id="vf" placeholder="单词 / 语法表达"><textarea id="vb" placeholder="中文意思、用法和例句"></textarea><button class="btn primary" onclick="addCard()">添加词卡</button>`)}
if(tab==='errors'){h=card('错题本',`<p class="small">做题时可将错误加入这里。复盘后标记已掌握。</p><input id="ep" placeholder="错误类型，例如：主旨概括"><textarea id="et" placeholder="题目、我的答案、正确答案和原因"></textarea><button class="btn primary" onclick="addError()">添加错题</button>`)+S.errors.map((e,i)=>card(esc(e.type),`<p>${esc(e.text)}</p><div class="row"><span class="pill">${e.done?'已掌握':'待复盘'}</span><button class="btn" onclick="toggleError(${i})">${e.done?'重新打开':'标记已掌握'}</button></div>`)).join('')}
if(tab==='logs'){h=card('记录一次学习',`<p class="small">45分钟完成课程 +30 XP；专项练习 +10 XP；错题复盘 +10 XP。每项每日按实际完成记录。</p><label>学习分钟数</label><input id="mins" type="number" value="45" min="1"><label>学习内容</label><input id="what" placeholder="例如：阅读句子拆解 + 语法专项"><label>状态</label><select id="mood"><option>状态不错</option><option>平静</option><option>有点累</option><option>赶时间</option></select><div class="row"><button class="btn primary" onclick="addLog(30,'45分钟课程')">完成45分钟课程 +30 XP</button><button class="btn" onclick="addLog(10,'专项练习')">记录专项练习 +10 XP</button></div><div class="row"><button class="btn" onclick="addLog(10,'错题复盘')">记录错题复盘 +10 XP</button><button class="btn" onclick="addLog(20,'真实语言输出')">完成真实语言输出 +20 XP</button><button class="btn" onclick="addLog(30,'每周检查点')">完成每周检查点 +30 XP</button></div>`)+S.logs.slice().reverse().map(l=>`<div class="card"><b>${esc(l.date)}</b> · ${l.min}分钟 · ${esc(l.kind)}<p>${esc(l.what)} <span class="pill">${esc(l.mood)}</span></p><span class="small">+${l.xp} XP</span></div>`).join('')}
if(tab==='progress'){h=card('学习进度',`<p>真实学习数据累计展示，不会根据猜测自动填入分数。</p><div class="grid">${['reading','listening','writing'].map((k,i)=>`<div class="stat"><div class="small">${['阅读','听力','写作'][i]}估分</div><div class="num">${S.estimate[k]??'待诊断'}</div></div>`).join('')}</div><h3>更新单项估分（仅在完成诊断后填写）</h3><div class="row"><input id="er" placeholder="阅读估分" type="number"><input id="el" placeholder="听力估分" type="number"><input id="ew" placeholder="写作估分" type="number"></div><button class="btn" onclick="setEstimate()">保存估分</button><div class="divider"></div>累计学习 ${S.logs.reduce((a,b)=>a+(+b.min||0),0)} 分钟 · 学习记录 ${S.logs.length} 次 · 错题 ${S.errors.length} 道 · 词卡 ${S.cards.length} 张`)}
if(tab==='backup'){h=card('数据备份与恢复',`<p>所有数据只保存在当前浏览器的本地存储中。建议每周导出一次JSON，换设备时导入。</p><div class="row"><button class="btn primary" onclick="exportData()">导出备份 JSON</button><label class="btn">导入备份<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div><p class="small">清空数据会删除本浏览器里的全部学习记录，操作前请先导出备份。</p><button class="btn" onclick="if(confirm('确定清空本地全部学习数据？')){S=fresh();save();draw()}">清空本地数据</button>`)}
$('app').innerHTML=h}
function renderQuiz(){let idx=+$('set').value,q=quiz[idx];$('quizarea').innerHTML=`<div class="divider"></div><h3>${q.type}</h3>${tipsFor(q.type+' '+q.text+' '+q.qs.map(x=>x.q+' '+x.o.join(' ')).join(' '),'做题前先看：相关技巧与语法',true)}<p>${q.text}</p><form id="qform">${q.qs.map((x,i)=>`<div class="q"><b>${i+1}. ${x.q}</b>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${'①②③④'[j]} ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary" type="button" onclick="submitQuiz(${idx})">提交答案并查看解析</button></form><div id="qfeedback"></div>`}
function submitQuiz(idx){let q=quiz[idx],score=0,feedback='',wrongCtx='';q.qs.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);let v=a?+a.value:-1;if(v===x.a)score++;else{wrongCtx+=' '+x.q+' '+x.e+' '+x.o.join(' ');S.errors.push({type:q.type+' · '+x.q,text:'我的答案：'+(v<0?'未作答':x.o[v])+'；正确答案：'+x.o[x.a]+'。'+x.e,done:false})}feedback+=`<div class="feedback"><b class="${v===x.a?'good':'bad'}">第${i+1}题：${v===x.a?'正确':'需要复习'}</b><p>正确答案：${x.o[x.a]}</p><p>${x.e}</p></div>`});S.results.push({date:today(),type:q.type,score,total:q.qs.length});S.xp+=10;save();$('qfeedback').innerHTML=`<div class="card"><h3>本组得分：${score}/${q.qs.length}</h3>${feedback}<p class="small">本组已完成，+10 XP。错题已自动加入错题本。</p></div>${wrongCtx?tipsFor(wrongCtx,'答错的题：相关资料',true):''}`;shell()}
function checkListen(){let v=document.querySelector('input[name=listen]:checked'),ok=v&&+v.value===1;$('listenfb').innerHTML=`<div class="feedback"><b class="${ok?'good':'bad'}">${ok?'回答正确':'再看一下时间信息'}</b><p>答案：일요일 오전 열 시。对话最后明确约在周日早上十点地铁站前见面。</p></div>`;if(!S.results.some(x=>x.type==='听力文本模拟'&&x.date===today())){S.xp+=10;S.results.push({date:today(),type:'听力文本模拟',score:ok?1:0,total:1});save()}}
function saveEssay(){let t=$('essay').value.trim();if(!t)return alert('先写一点内容再保存');S.writing.push({date:today(),text:t});save();alert('写作已保存在本地。完成真实语言输出可在学习记录中登记 +20 XP。')}
function addCard(){let f=$('vf').value.trim(),b=$('vb').value.trim();if(!f||!b)return alert('请填写词条和解释');S.cards.push({front:f,back:b,box:0,due:today()});save();draw()}
function rateCard(i,ok){let c=S.cards[i],interval=[1,3,7,14,30];c.box=ok?Math.min(4,c.box+1):0;c.due=plus(ok?interval[c.box]:0);save();draw()}
function addError(){let p=$('ep').value.trim(),t=$('et').value.trim();if(!p||!t)return alert('请填写错误类型和内容');S.errors.push({type:p,text:t,done:false});save();draw()}
function toggleError(i){S.errors[i].done=!S.errors[i].done;save();draw()}
function addLog(xp,kind){let what=$('what').value.trim();if(!what)return alert('请填写学习内容');let min=+$('mins').value||0;if(kind==='45分钟课程'&&min<45)return alert('课程积分要求至少完成45分钟；如果只做了专项练习，请选专项练习积分。');if(kind==='每周检查点'&&!confirm('确认本周检查点已经完成？'))return;S.logs.push({date:today(),min,what,kind,mood:$('mood').value,xp});S.xp+=xp;save();draw()}
function setEstimate(){['reading','listening','writing'].forEach((k,i)=>{let v=[$('er').value,$('el').value,$('ew').value][i];if(v!=='')S.estimate[k]=+v});save();draw()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='singher-topik-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(typeof d.xp!=='number'||!Array.isArray(d.logs))throw 0;if(confirm('导入将覆盖当前本地学习数据，确定继续？')){S=d;save();draw()}}catch(e){alert('备份文件格式不正确')}};r.readAsText(f)}
const LG=[[1,3,25,'图片题'],[4,8,26,'连续语句'],[9,12,27,'接下来行动'],[13,16,28,'与原文一致'],[17,20,29,'中心思想']];
for(let k=21;k<=49;k+=2)LG.push([k,k+1,30+(k-21)/2,'']);
const LURL='https://sunnie.fun/topik/listening/skill/';
function lname(g){return '第'+g[0]+'-'+g[1]+'题'+(g[3]?' · '+g[3]:'')}
function listenHTML(){
 let recs=S.listenRec,tc=recs.reduce((a,r)=>a+r.c,0),tt=recs.reduce((a,r)=>a+r.total,0);
 let list=LG.map((g,i)=>{let rs=recs.filter(r=>r.gi===i),last=rs.at(-1);
  return `<div class="q"><b>${esc(lname(g))}</b> <span class="pill">${last?'最近 '+last.c+'/'+last.total+'（共'+rs.length+'次）':'未做'}</span>${tipsFor(lname(g)+' 听力')}<div class="row" style="margin-top:6px"><a class="btn" href="${LURL+g[2]}" target="_blank" rel="noopener noreferrer">打开原站听题</a></div></div>`}).join('');
 let form=`<div class="divider"></div><h3>记录结果</h3><p class="small">在原站听完、对完答案后，回来填。每组每天第一次记录 +10 XP，答错不扣分。</p><select id="lg">${LG.map((g,i)=>`<option value="${i}">${esc(lname(g))}</option>`).join('')}</select><div class="row"><input id="lc" type="number" min="0" placeholder="对了几题"><input id="lq" type="number" min="0" placeholder="其中几题是猜的"></div><textarea id="ln" style="min-height:70px" placeholder="听到了但没连上的词或句子（可不填）"></textarea><button class="btn primary" onclick="saveListen()">保存听力记录</button>`;
 let sum=tt?`<p class="small">听力累计正确率：${tc}/${tt}（${Math.round(tc/tt*100)}%）。这只是你做过的题的正确率，不是 TOPIK 估分。</p>`:'';
 return card('听力训练 · 原站真题分组',`<p class="small">音频和题目在 sunnie.fun 原站，点“打开原站听题”会在新窗口打开。网站不复制原站内容。</p>${sum}${list}${form}`)}
function saveListen(){
 let gi=+$('lg').value,g=LG[gi],total=g[1]-g[0]+1,c=$('lc').value,q=$('lq').value;
 if(c===''||+c<0||+c>total)return alert('对了几题请填 0 到 '+total);
 c=+c;q=q===''?0:+q;if(q<0||q>total)return alert('猜的题数请填 0 到 '+total);
 let notes=$('ln').value.trim(),first=!S.listenRec.some(r=>r.gi===gi&&r.date===today());
 S.listenRec.push({date:today(),gi,range:g[0]+'-'+g[1],c,total,guess:q,notes});
 if(c<total)S.errors.push({type:'听力 · '+lname(g),text:'对 '+c+'/'+total+'，其中猜的 '+q+' 题。'+(notes?'没连上的内容：'+notes:''),done:false});
 if(first)S.xp+=10;
 save();draw();alert('已保存'+(first?'，+10 XP':'')+(c<total?'。答错的已进入错题本。':'。'))}

function normK(t){return String(t).replace(/[-~\s()（）]/g,'')}
function noteMatch(n,ctx){if(!ctx)return false;let c=normK(ctx);
 if(n.tags.some(t=>t&&c.includes(normK(t))))return true;
 let ks=String(n.title).split(/[\s\/]+/).map(normK).filter(k=>k.length>=3);
 return ks.some(k=>c.includes(k))}
function tipsFor(ctx,label,open){let ns=(S.notes||[]).filter(n=>noteMatch(n,ctx));if(!ns.length)return '';
 let body=ns.map(n=>`<div class="note"><b>${esc(n.title)}</b>\n${esc(n.body)}</div>`).join('');
 return `<details class="card"${open?' open':''}><summary>${esc(label||'相关资料')}（${ns.length}）</summary>${body}</details>`}
function parseNotes(txt){let out=[];txt.replace(/\r/g,'').split(/^##\s+/m).slice(1).forEach(ch=>{let ls=ch.split('\n'),title=ls.shift().trim();if(!title)return;let tags=[];
 if(ls.length&&/^\s*(标签|tags?)\s*[:：]/i.test(ls[0])){tags=ls.shift().replace(/^\s*(标签|tags?)\s*[:：]/i,'').split(/[,，、;；\s]+/).filter(Boolean)}
 out.push({title,tags,body:ls.join('\n').trim()})});return out}
function addNotes(list){let n=0;list.forEach(x=>{if(!x.body)return;let i=S.notes.findIndex(y=>y.title===x.title);if(i>=0)S.notes[i]=x;else S.notes.push(x);n++});save();return n}
function importNotes(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let n=addNotes(parseNotes(r.result));alert(n?'已导入 '+n+' 条资料':'没有读到资料。请检查每条是否以 "## 标题" 开头');draw()};r.readAsText(f)}
function addNoteForm(){let t=$('nt').value.trim(),b=$('nb').value.trim();if(!t||!b)return alert('请填写标题和内容');addNotes([{title:t,tags:$('ng').value.split(/[,，、;；\s]+/).filter(Boolean),body:b}]);draw()}
function delNote(i){if(confirm('删除这条资料？')){S.notes.splice(i,1);save();draw()}}
function notesHTML(){
 let ex='## -는 바람에\n标签: 语法, 바람에, 阅读\n意外原因导致负面结果。\n例：회의가 길어지는 바람에 점심시간을 놓쳤어요.\n\n## 中心思想题技巧\n标签: 听力, 中心思想, 阅读\n先看结尾的建议句或转折词。';
 return card('资料库 · 我自己的技巧、语法、作文模板',`<p class="small">资料只存在你的浏览器里，不会进入 GitHub 仓库。做题和听力时，标签或标题匹配的资料会自动出现。</p>
 <h3>从文件导入（.txt 或 .md）</h3><label class="btn">选择文件<input type="file" accept=".txt,.md,text/plain" style="display:none" onchange="importNotes(this)"></label>
 <p class="small">文件格式：每条以 “## 标题” 开头；下一行可写 “标签: 词1, 词2”；其余是内容。同标题会覆盖。示例：</p><div class="feedback small" style="white-space:pre-wrap">${esc(ex)}</div>
 <p class="small">常用标签：听力、阅读、语法、写作、51、52、53、54、题型名（如 中心思想）。语法条目也可以把表达本身写进标签，比如 바람에。</p>
 <div class="divider"></div><h3>手动添加一条</h3><input id="nt" placeholder="标题"><input id="ng" placeholder="标签，用逗号隔开"><textarea id="nb" placeholder="内容"></textarea><button class="btn primary" onclick="addNoteForm()">添加</button>`)+
 (S.notes.length?card('已有资料（'+S.notes.length+'）',S.notes.map((n,i)=>`<details><summary>${esc(n.title)} ${n.tags.map(t=>'<span class="pill">'+esc(t)+'</span>').join(' ')}</summary><div class="note">${esc(n.body)}</div><button class="btn" onclick="delNote(${i})">删除</button></details>`).join('')):'')}

draw();
</script></body></html>
